<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danke für Ihre Beteiligung!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="spd-logo">SPD</span>
                <h1>Schulwegsicherheit</h1>
            </div>
        </header>

        <main class="success-page">
            <div class="success-message">
                <div class="success-icon">✓</div>
                <h2>Vielen Dank!</h2>
                <p>Ihr Beitrag zur Schulwegsicherheit wurde erfolgreich übermittelt.</p>
                <p>Die SPD-Fraktion wird sich Ihrem Anliegen annehmen und prüfen, welche Maßnahmen umgesetzt werden können.</p>
                
                <div class="success-actions">
                    <a href="index.html" class="btn-secondary">Neue Meldung erstellen</a>
                    <a href="https://spd-kirchlengern.de" class="btn-primary" target="_blank">Zur SPD-Website</a>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p><strong>SPD Kirchlengern</strong></p>
            </div>
        </footer>
    </div>
</body>
</html>
